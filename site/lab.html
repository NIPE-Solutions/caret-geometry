<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Caret Geometry Lab</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="lab">
      <a href="/">← Documentation</a>
      <h1>Real-browser calibration lab</h1>
      <p>Move the native caret. The cyan axis is the predicted rectangle.</p>
      <label
        >Textarea<textarea rows="6">
first line
second line</textarea></label
      ><label>Input<input type="text" value="Move this caret" /></label
      ><label
        >Contenteditable
        <div class="editable" contenteditable>
          Editable text with <strong>nested markup</strong>.
        </div></label
      ><output id="diagnostic"></output>
      <div class="code-example" data-code-example="lab">
        <button
          class="code-toggle"
          data-code-toggle
          aria-expanded="false"
          aria-controls="lab-code"
        >
          Show code
        </button>
        <div id="lab-code" class="code-region" data-code-region hidden>
          <button data-copy class="copy-button">Copy</button>
          <pre><code></code></pre>
        </div>
      </div>
    </main>
    <div id="marker"></div>
    <script type="module" src="/lab.ts"></script>
  </body>
</html>
