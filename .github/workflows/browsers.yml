name: Browsers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=chromium --reporter=line,html
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-chromium
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
